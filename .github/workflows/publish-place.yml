name: Publish Roblox place

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/publish-place.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Primary = main game. Secondary = reserve place.
        type: choice
        options:
          - primary
          - secondary
        default: secondary
      version_type:
        description: Saved = cloud draft. Published = live place.
        type: choice
        options:
          - Saved
          - Published
        default: Saved

env:
  ROJO_VERSION: "7.7.0"
  PRIMARY_UNIVERSE_ID: "10720619997"
  PRIMARY_PLACE_ID: "81136506656442"
  SECONDARY_UNIVERSE_ID: "10735659349"
  SECONDARY_PLACE_ID: "113088894576682"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rojo
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/rojo.zip \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -qo /tmp/rojo.zip -d /tmp/rojo-extract
          install -m 0755 /tmp/rojo-extract/rojo "$HOME/.local/bin/rojo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build place
        run: |
          set -euo pipefail
          rojo --version
          rojo build game/default.project.json -o place.rbxl
          ls -lh place.rbxl

      - name: Publish to Open Cloud
        env:
          TARGET: ${{ github.event.inputs.target || 'secondary' }}
          VERSION_TYPE: ${{ github.event.inputs.version_type || 'Published' }}
          ROBLOX_API_KEY_PRIMARY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_API_KEY_SECONDARY: ${{ secrets.ROBLOX_API_KEY1 }}
        run: |
          set -euo pipefail
          if [ "${TARGET}" = "secondary" ]; then
            UNIVERSE_ID="${SECONDARY_UNIVERSE_ID}"
            PLACE_ID="${SECONDARY_PLACE_ID}"
            ROBLOX_API_KEY="${ROBLOX_API_KEY_SECONDARY}"
            secret_name="ROBLOX_API_KEY1"
          else
            UNIVERSE_ID="${PRIMARY_UNIVERSE_ID}"
            PLACE_ID="${PRIMARY_PLACE_ID}"
            ROBLOX_API_KEY="${ROBLOX_API_KEY_PRIMARY}"
            secret_name="ROBLOX_API_KEY"
          fi
          if [ -z "${ROBLOX_API_KEY}" ]; then
            echo "Missing secret ${secret_name}. Add it in repo Settings → Secrets → Actions."
            echo "Creator Hub: API key with universe-places:write on universe ${UNIVERSE_ID}."
            exit 1
          fi
          echo "Publishing to ${TARGET} (universe ${UNIVERSE_ID}, place ${PLACE_ID})"
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=${VERSION_TYPE}"
          echo "POST ${url}"
          curl -sS --fail-with-body -X POST "$url" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @place.rbxl
          echo
